EditTransactionsBulkRequest:
  type: object
  description: >
    Request to bulk update multiple transactions. Supports updating
    the category, account, or memo for the selected transactions.
  required:
    - transactionIds
    - updates
  properties:
    transactionIds:
      type: array
      minItems: 1
      description: IDs of the transactions to update.
      items:
        type: string
        format: uuid

    updates:
      type: object
      description: >
        The field to update. Exactly one of categoryId, accountId,
        or memo must be provided.
      minProperties: 1
      maxProperties: 1
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID of the category to assign to the transactions.

        accountId:
          type: string
          format: uuid
          description: ID of the account to assign the transactions to.

        memo:
          type: string
          maxLength: 100
          description: >
            Memo to assign to the transactions. Leading and trailing
            whitespace is trimmed.
      oneOf:
        - required:
            - categoryId
        - required:
            - accountId
        - required:
            - memo
