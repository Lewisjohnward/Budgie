patch:
  summary: Update a category
  description: >
    Updates a user category. The category may be renamed, moved to another
    category group, and/or reordered within its category group.

    When a category is moved or reordered, the response contains position
    patches for all affected categories so clients can reconcile their local
    state without fetching the entire category collection.

    The category returned in `updated.category` represents the primary category
    modified by the operation. The `updated.categories` array contains patches
    for categories whose position or category group changed as a result of
    the operation.
  operationId: updateCategory
  tags:
    - Categories
  security:
    - bearerAuth: []

  parameters:
    - in: path
      name: categoryId
      required: true
      schema:
        type: string
      description: The ID of the category to update.
      example: "8a7b6c5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: The new name for the category.
              example: "Holiday"
            categoryGroupId:
              type: string
              description: >
                The ID of the category group to move the category into.
              example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
            position:
              type: integer
              description: >
                The zero-based position of the category within its category group.
              minimum: 0
              example: 2
          minProperties: 1

  responses:
    "200":
      description: Category updated
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/categories/updateCategory.yml#/UpdateCategoryResponse"

    "401":
      description: Unauthorized

    "403":
      description: Forbidden

    "404":
      description: Category not found

    "409":
      description: A category with the requested name already exists

    "422":
      description: Invalid category update request

delete:
  summary: Delete category
  description: >
    Deletes a category reassigning transactions and assigned money
  operationId: deleteCategory
  tags:
    - Categories
  security:
    - bearerAuth: []

  parameters:
    - in: path
      name: categoryId
      required: true
      schema:
        type: string
      description: The ID of the category to delete.

  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            inheritingCategoryId:
              type: string
              description: The category that will inherit the transactions assigned to the deleted category.
              example: "8a7b6c5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d"

  responses:
    "200":
      description: Category deleted
      content:
        application/json:
          schema:
            $ref: "../../schemas/responses/categories/deleteCategory.yml#/DeleteCategoryResponse"

    "401":
      description: Unauthorized

    "403":
      description: Forbidden

    "404":
      description: Category not found

    "422":
      description: Invalid category deletion request
