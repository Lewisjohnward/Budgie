patch:
  summary: Edit memo
  description: >
    Edit memo for the authenticated user.
  operationId: editMemo
  tags:
    - Memos
  security:
    - bearerAuth: []

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: string

  responses:
    "200":
      description: Successfully updated memo
      content:
        application/json:
          schema:
            $ref: "../../schemas/entities/memo.yml#/Memo"
          examples:
            success:
              value:
                id: "memo_123"
                month: "2025-12"
                content: "25/12 Jesus's bday"

    "401":
      description: Unauthorized

    "400":
      description: Bad request (invalid input or malformed payload)

    "404":
      description: Memo not found or owned by user

    "500":
      description: Server error
