services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - budgie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    image: ghcr.io/lewisjohnward/budgie-backend:latest
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydb
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/lewisjohnward/budgie-frontend:latest
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  budgie_data:
  caddy_data:
  caddy_config:
